<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driftline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="ambient-glow" aria-hidden="true"></div>

  <main class="page">
    <header class="topbar">
      <span class="wordmark">Driftline</span>
    </header>

    <form id="search-form" class="search-bar" autocomplete="off">
      <input
        type="text"
        id="ticker-input"
        placeholder="Search a ticker, like AAPL or TSLA"
        aria-label="Stock ticker symbol"
      />
      <button type="submit">View chart</button>
    </form>

    <p id="status-message" class="status-message" role="status" aria-live="polite"></p>

    <section class="chart-panel">
      <div id="chart-header" class="chart-header hidden">
        <div class="chart-header-left">
          <span id="chart-symbol" class="chart-symbol"></span>
          <span id="chart-price" class="chart-price"></span>
        </div>
        <span id="chart-change" class="chart-change"></span>
      </div>

      <div id="empty-state" class="empty-state">
        Search a ticker above to load its chart.
      </div>

      <div id="chart-container" class="chart-container hidden"></div>
    </section>

    <p class="disclaimer">
      The dashed line is a simple trend projection based on the last 30 closing prices.
      It is not financial advice and it is not a real forecast.
    </p>
  </main>

  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <script src="script.js"></script>
</body>
</html>
